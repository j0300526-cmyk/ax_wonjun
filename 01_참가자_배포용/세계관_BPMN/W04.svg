0" cy="550.0" r="16.0" fill="white" stroke="#314755" stroke-width="4"/><text x="1638.0" y="590.0" text-anchor="middle" font-family="Malgun Gothic,sans-serif" font-size="17">자료 보완·보류</text><text x="24" y="662" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#52616b">○ 시작   굵은 원 종료   둥근 사각형 활동   × 마름모 조건 분기   화살표 처리 순서   가로 구역 담당 역할</text><text x="24" y="692" font-family="Malgun Gothic,sans-serif" font-size="16" fill="#52616b">승인 분기는 사람이 수행한 별도 승인 절차의 결과이며, 세부 승인 단계는 생략했습니다. 보류·재검토 종료는 이번 검토 회차의 종료로, 후속 확인 의무의 종료를 뜻하지 않습니다.</text></svg>